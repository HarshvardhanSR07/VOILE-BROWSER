<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base background gradient -->
    <radialGradient id="oceanicGlow" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0B1A36" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#071024" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#040814" stop-opacity="1" />
    </radialGradient>

    <!-- Silk Wave 1 Gradient -->
    <linearGradient id="silk1" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#08214D" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#0D3578" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#081E44" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#040914" stop-opacity="0.95" />
    </linearGradient>

    <!-- Silk Wave 2 Gradient (Lighter, Vibrant Blue) -->
    <linearGradient id="silk2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D449C" stop-opacity="0.75" />
      <stop offset="30%" stop-color="#1456BD" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#0B2B66" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#040C1E" stop-opacity="0.9" />
    </linearGradient>

    <!-- Silk Wave 3 Gradient (Foreground ribbon) -->
    <linearGradient id="silk3" x1="100%" y1="20%" x2="0%" y2="80%">
      <stop offset="0%" stop-color="#0B306B" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#071E42" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#030814" stop-opacity="0.95" />
    </linearGradient>

    <!-- Silk Wave 4 Gradient (Deep lower crest) -->
    <linearGradient id="silk4" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0F4BAA" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#0A285C" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#030814" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing Crest Stroke 1 -->
    <linearGradient id="crestGlow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#60A5FA" stop-opacity="0.55" />
      <stop offset="85%" stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Glowing Crest Stroke 2 -->
    <linearGradient id="crestGlow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0" />
      <stop offset="35%" stop-color="#93C5FD" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0" />
    </linearGradient>

    <!-- Soft Blur for lighting -->
    <filter id="silkBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
  </defs>

  <!-- Deep Base Canvas -->
  <rect width="1920" height="1080" fill="url(#oceanicGlow)" />

  <!-- Ambient Light Splashes -->
  <circle cx="350" cy="450" r="400" fill="#0284C7" opacity="0.12" filter="url(#silkBlur)" />
  <circle cx="1600" cy="550" r="450" fill="#1D4ED8" opacity="0.10" filter="url(#silkBlur)" />
  <circle cx="960" cy="900" r="500" fill="#0369A1" opacity="0.08" filter="url(#silkBlur)" />

  <!-- Wave Layer 1: Left-to-Center Rising Silk Ribbon -->
  <path 
    d="M-100 680 C 250 480, 550 820, 1100 600 C 1450 460, 1750 560, 2050 490 L 2050 1200 L -100 1200 Z" 
    fill="url(#silk1)" 
  />

  <!-- Wave Layer 2: Main Graceful Flowing Ribbon -->
  <path 
    d="M-80 500 C 320 340, 700 780, 1250 530 C 1600 370, 1850 580, 2050 520 L 2050 1200 L -80 1200 Z" 
    fill="url(#silk2)" 
  />
  <!-- Highlight Crest for Wave 2 -->
  <path 
    d="M-80 500 C 320 340, 700 780, 1250 530 C 1600 370, 1850 580, 2050 520" 
    stroke="url(#crestGlow1)" 
    stroke-width="2.5" 
    fill="none" 
  />

  <!-- Wave Layer 3: Smooth Intersecting Ribbon -->
  <path 
    d="M-60 760 C 350 620, 680 850, 1150 710 C 1550 580, 1820 730, 2050 670 L 2050 1200 L -60 1200 Z" 
    fill="url(#silk3)" 
  />
  <!-- Highlight Crest for Wave 3 -->
  <path 
    d="M-60 760 C 350 620, 680 850, 1150 710 C 1550 580, 1820 730, 2050 670" 
    stroke="url(#crestGlow2)" 
    stroke-width="2" 
    fill="none" 
  />

  <!-- Wave Layer 4: Deep Forefront Silk Curve -->
  <path 
    d="M-50 880 C 420 760, 850 940, 1380 810 C 1720 720, 1920 820, 2050 780 L 2050 1200 L -50 1200 Z" 
    fill="url(#silk4)" 
  />

  <!-- Subtle Vignette Shade at very bottom -->
  <rect y="860" width="1920" height="220" fill="url(#oceanicGlow)" opacity="0.75" />
</svg>
